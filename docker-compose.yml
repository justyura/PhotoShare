---
services:
  db:
    image: postgres:17-alpine
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: always
    environment:
      POSTGRES_USER: ${PSQL_USER}
      POSTGRES_PASSWORD: ${PSQL_PASSWORD}
      POSTGRES_DB: ${PSQL_DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PSQL_USER} -d ${PSQL_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    restart: always
    ports:
      - 3333:8080

  photoshare:
    build: .
    image: photoshare:dev
    volumes:
      - images:/data/images
    restart: always
    depends_on: 
      db:
        condition: service_healthy

    ports:
      - 3000:3000
    environment:
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      PSQL_HOST: db
      PSQL_PORT: 5432 
      PSQL_USER: ${PSQL_USER}
      PSQL_PASSWORD: ${PSQL_PASSWORD} 
      PSQL_DATABASE: ${PSQL_DATABASE} 
      PSQL_SSLMODE: disable 
      CSRF_KEY: ${CSRF_KEY}
      CSRF_SECURE: "false" 
      BASE_URL: http://localhost:3000

volumes:
  db-data:
  images:
...
